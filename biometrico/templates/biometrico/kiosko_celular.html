{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#061224">
    <title>Lector biométrico celular | ClockIn</title>
    <style>
        :root {
            --bg: #061224;
            --panel: rgba(15, 23, 42, .82);
            --line: rgba(148, 163, 184, .18);
            --text: #f8fafc;
            --muted: #9fb3c8;
            --ok: #22c55e;
            --warn: #f59e0b;
            --danger: #ef4444;
            --brand: #38bdf8;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: radial-gradient(circle at top, #123767 0, #07182d 42%, #030712 100%);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }

        body { min-height: 100dvh; }

        .mobile-reader {
            height: 100dvh;
            width: 100vw;
            display: grid;
            grid-template-rows: auto 1fr auto;
            padding: calc(10px + var(--safe-top)) 12px calc(10px + var(--safe-bottom));
            gap: 10px;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 58px;
        }

        .brand {
            min-width: 0;
        }

        .brand strong {
            display: block;
            font-size: 17px;
            line-height: 1.1;
        }

        .brand span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 56vw;
        }

        .status-pill {
            border: 1px solid var(--line);
            background: rgba(15, 23, 42, .68);
            color: #dbeafe;
            border-radius: 999px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .status-pill.offline { color: #fecaca; border-color: rgba(239, 68, 68, .35); }
        .status-pill.ready { color: #bbf7d0; border-color: rgba(34, 197, 94, .35); }

        .camera-shell {
            min-height: 0;
            border: 1px solid rgba(148, 163, 184, .2);
            border-radius: 28px;
            background: rgba(2, 6, 23, .62);
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .34);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #020617;
        }

        .face-guide {
            position: absolute;
            inset: 11% 13% 19%;
            border: 3px solid rgba(56, 189, 248, .78);
            border-radius: 42% 42% 36% 36%;
            box-shadow: 0 0 0 999px rgba(2, 6, 23, .24), 0 0 42px rgba(56, 189, 248, .18);
            pointer-events: none;
        }

        .face-guide.ok { border-color: rgba(34, 197, 94, .9); }
        .face-guide.error { border-color: rgba(239, 68, 68, .9); }
        .face-guide.warn { border-color: rgba(245, 158, 11, .9); }

        .camera-message {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid rgba(148, 163, 184, .18);
            border-radius: 22px;
            background: rgba(15, 23, 42, .86);
            backdrop-filter: blur(14px);
            padding: 14px;
        }

        .camera-message strong {
            display: block;
            font-size: 19px;
            margin-bottom: 4px;
        }

        .camera-message span {
            color: var(--muted);
            font-size: 13px;
        }

        .result {
            display: grid;
            grid-template-columns: 52px 1fr;
            gap: 12px;
            align-items: center;
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 24px;
            padding: 12px;
            min-height: 80px;
        }

        .result-icon {
            width: 52px;
            height: 52px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: rgba(56, 189, 248, .15);
            font-size: 24px;
        }

        .result-name {
            font-size: 18px;
            font-weight: 950;
            line-height: 1.1;
        }

        .result-detail {
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .ctrl {
            border: 1px solid rgba(148, 163, 184, .16);
            background: rgba(15, 23, 42, .86);
            color: var(--text);
            border-radius: 18px;
            min-height: 56px;
            padding: 8px 6px;
            font-size: 11px;
            font-weight: 900;
            display: grid;
            place-items: center;
            gap: 3px;
            touch-action: manipulation;
        }

        .ctrl span { font-size: 19px; line-height: 1; }
        .ctrl.primary { background: linear-gradient(135deg, #2563eb, #0ea5e9); }
        .ctrl.danger { background: rgba(239, 68, 68, .18); color: #fecaca; }

        .mode-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .mode {
            border: 1px solid var(--line);
            border-radius: 18px;
            min-height: 46px;
            background: rgba(15, 23, 42, .72);
            color: #cbd5e1;
            font-weight: 950;
        }

        .mode.active.entrada { background: rgba(34, 197, 94, .22); color: #bbf7d0; border-color: rgba(34, 197, 94, .45); }
        .mode.active.salida { background: rgba(245, 158, 11, .22); color: #fde68a; border-color: rgba(245, 158, 11, .45); }

        canvas { display: none; }


        .status-pill.work { color: #bae6fd; border-color: rgba(56, 189, 248, .38); }

        .top-actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .sound-toggle {
            border: 1px solid var(--line);
            background: rgba(15, 23, 42, .68);
            color: #dbeafe;
            border-radius: 999px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 900;
            white-space: nowrap;
            touch-action: manipulation;
        }

        .sound-toggle.off {
            color: #cbd5e1;
            background: rgba(15, 23, 42, .42);
        }

        .camera-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(2, 6, 23, .28) 0%, transparent 25%, transparent 65%, rgba(2, 6, 23, .72) 100%);
            z-index: 1;
        }

        .mobile-reader[data-state="FACE_DETECTED"] .camera-shell,
        .mobile-reader[data-state="SUCCESS"] .camera-shell {
            border-color: rgba(22, 255, 118, .86);
            box-shadow: 0 0 0 2px rgba(22, 255, 118, .2), 0 0 58px rgba(22, 255, 118, .3), 0 24px 70px rgba(0, 0, 0, .42);
        }

        .mobile-reader[data-state="ALREADY_MARKED"] .camera-shell {
            border-color: rgba(251, 191, 36, .9);
            box-shadow: 0 0 0 2px rgba(251, 191, 36, .22), 0 0 54px rgba(251, 191, 36, .32), 0 24px 70px rgba(0, 0, 0, .42);
        }

        .mobile-reader[data-state="DENIED"] .camera-shell {
            border-color: rgba(255, 59, 87, .82);
            box-shadow: 0 0 0 2px rgba(255, 59, 87, .18), 0 0 54px rgba(255, 59, 87, .26), 0 24px 70px rgba(0, 0, 0, .42);
        }

        .mobile-reader[data-state="ERROR"] .camera-shell,
        .mobile-reader[data-state="NO_CAMERA"] .camera-shell,
        .mobile-reader[data-state="OFFLINE"] .camera-shell {
            border-color: rgba(56, 189, 248, .72);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, .14), 0 0 46px rgba(56, 189, 248, .20), 0 24px 70px rgba(0, 0, 0, .42);
        }

        .face-guide.ok {
            border-width: 4px;
            border-color: #16ff76;
            box-shadow: 0 0 0 999px rgba(2, 6, 23, .13), 0 0 24px rgba(22, 255, 118, .78), 0 0 70px rgba(22, 255, 118, .34);
            animation: faceOkPulse 1.1s ease-in-out infinite;
        }

        .face-guide.warn {
            border-width: 4px;
            border-color: #fbbf24;
            box-shadow: 0 0 0 999px rgba(2, 6, 23, .16), 0 0 26px rgba(251, 191, 36, .70), 0 0 68px rgba(251, 191, 36, .30);
        }

        .face-guide.verifying {
            border-style: dashed;
            animation: verifyPulse .9s ease-in-out infinite;
        }

        .state-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(56, 189, 248, .12);
            color: #bae6fd;
            border: 1px solid rgba(56, 189, 248, .18);
            font-size: 11px;
            font-weight: 950;
            text-transform: uppercase;
        }

        .state-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 16px currentColor;
        }

        .reader-result-overlay {
            position: absolute;
            inset: 0;
            z-index: 8;
            display: grid;
            place-items: center;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transform: scale(.98);
            transition: opacity .18s ease, transform .24s ease;
        }

        .reader-result-overlay.show { opacity: 1; transform: scale(1); }
        .reader-result-overlay.success { background: radial-gradient(circle at center, rgba(22, 255, 118, .34), rgba(5, 46, 22, .18) 46%, rgba(2, 6, 23, .32) 100%); }
        .reader-result-overlay.warning { background: radial-gradient(circle at center, rgba(251, 191, 36, .34), rgba(120, 53, 15, .18) 46%, rgba(2, 6, 23, .32) 100%); }
        .reader-result-overlay.denied { background: radial-gradient(circle at center, rgba(255, 59, 87, .30), rgba(69, 10, 10, .18) 46%, rgba(2, 6, 23, .32) 100%); }
        .reader-result-overlay.error { background: radial-gradient(circle at center, rgba(56, 189, 248, .26), rgba(12, 74, 110, .16) 46%, rgba(2, 6, 23, .32) 100%); }

        .reader-result-card {
            display: grid;
            justify-items: center;
            gap: 8px;
            text-align: center;
            animation: resultPop .46s cubic-bezier(.2, 1.2, .32, 1) both;
        }

        .reader-result-mark {
            width: clamp(104px, 32vw, 136px);
            height: clamp(104px, 32vw, 136px);
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: clamp(54px, 17vw, 76px);
            font-weight: 1000;
            background: linear-gradient(135deg, #22c55e, #16ff76);
            box-shadow: 0 22px 60px rgba(0, 0, 0, .38), 0 0 60px rgba(22, 255, 118, .58);
        }

        .reader-result-overlay.warning .reader-result-mark {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            color: #1f1300;
            box-shadow: 0 22px 60px rgba(0, 0, 0, .38), 0 0 60px rgba(251, 191, 36, .48);
        }

        .reader-result-overlay.denied .reader-result-mark {
            background: linear-gradient(135deg, #ef4444, #ff3b57);
            box-shadow: 0 22px 60px rgba(0, 0, 0, .38), 0 0 60px rgba(255, 59, 87, .48);
        }

        .reader-result-overlay.error .reader-result-mark {
            background: linear-gradient(135deg, #0ea5e9, #38bdf8);
            color: #03121f;
            box-shadow: 0 22px 60px rgba(0, 0, 0, .38), 0 0 60px rgba(56, 189, 248, .40);
        }

        .reader-result-title {
            font-size: clamp(34px, 10vw, 48px);
            font-weight: 1000;
            line-height: .96;
            letter-spacing: 0;
            text-shadow: 0 14px 34px rgba(0, 0, 0, .42);
        }

        .reader-result-subtitle { font-size: clamp(17px, 5vw, 22px); font-weight: 900; }
        .reader-result-meta { color: rgba(248, 250, 252, .88); font-size: 14px; font-weight: 750; }
        .result-icon.ok { background: rgba(34, 197, 94, .18); border-color: rgba(34, 197, 94, .34); color: #bbf7d0; }
        .result-icon.warn { background: rgba(251, 191, 36, .18); border-color: rgba(251, 191, 36, .36); color: #fde68a; }
        .result-icon.bad { background: rgba(239, 68, 68, .18); border-color: rgba(239, 68, 68, .34); color: #fecaca; }
        .result-icon.info { background: rgba(56, 189, 248, .16); border-color: rgba(56, 189, 248, .34); color: #bae6fd; }

        @keyframes faceOkPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.026); } }
        @keyframes verifyPulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.025); opacity: 1; } }
        @keyframes resultPop { 0% { opacity: 0; transform: scale(.70) translateY(14px); } 58% { opacity: 1; transform: scale(1.08) translateY(0); } 100% { opacity: 1; transform: scale(1); } }
        @media (orientation: landscape) and (max-height: 520px) {
            .mobile-reader {
                grid-template-columns: 1fr 280px;
                grid-template-rows: auto 1fr;
            }
            .camera-shell {
                grid-row: 1 / span 2;
            }
            .top, .result, .controls-wrap {
                grid-column: 2;
            }
            .controls {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 340px) {
            .controls { gap: 6px; }
            .ctrl { min-height: 52px; font-size: 10px; border-radius: 16px; }
            .camera-message strong { font-size: 17px; }
        }
    </style>
</head>
<body>
    <main class="mobile-reader" id="reader" data-state="WAITING">
        <header class="top">
            <div class="brand">
                <strong>ClockIn</strong>
                <span>Lector biométrico para celular</span>
            </div>
            <div class="top-actions">
                <button class="sound-toggle" id="btnSound" type="button" aria-label="Activar o desactivar sonido">Sonido ON</button>
                <div class="status-pill ready" id="connectionStatus">Conectado</div>
            </div>
        </header>

        <section class="camera-shell" id="cameraShell">
            <video id="video" autoplay playsinline muted></video>
            <div class="camera-vignette"></div>
            <div class="face-guide" id="faceGuide"></div>
            <div class="reader-result-overlay" id="readerOverlay" aria-hidden="true">
                <div class="reader-result-card">
                    <div class="reader-result-mark" id="readerOverlayIcon">✓</div>
                    <div class="reader-result-title" id="readerOverlayTitle">Correcto</div>
                    <div class="reader-result-subtitle" id="readerOverlaySubtitle">Acceso correcto</div>
                    <div class="reader-result-meta" id="readerOverlayMeta"></div>
                </div>
            </div>
            <div class="camera-message">
                <div class="state-chip"><span class="state-dot"></span><span id="stateLabel">Esperando</span></div>
                <strong id="mainMessage">Acerque su rostro</strong>
                <span id="subMessage">Use la cámara frontal y mantenga el rostro dentro del marco.</span>
            </div>
        </section>

        <section class="result" id="resultBox">
            <div class="result-icon" id="resultIcon">ID</div>
            <div>
                <div class="result-name" id="resultName">Esperando marcación</div>
                <div class="result-detail" id="resultDetail">Sin lectura activa.</div>
            </div>
        </section>

        <section class="controls-wrap">
            <div class="mode-row">
                <button class="mode entrada active" id="btnEntrada" type="button">Entrada</button>
                <button class="mode salida" id="btnSalida" type="button">Salida</button>
            </div>
            <div style="height:8px"></div>
            <div class="controls">
                <button class="ctrl primary" id="btnStart" type="button"><span>▶</span>Iniciar</button>
                <button class="ctrl" id="btnFlip" type="button"><span>↺</span>Cámara</button>
                <button class="ctrl" id="btnFull" type="button"><span>⛶</span>Full</button>
                <button class="ctrl" id="btnReload" type="button"><span>⟳</span>Recargar</button>
                <button class="ctrl danger" id="btnExit" type="button"><span>×</span>Salir</button>
            </div>
        </section>
    </main>

    <canvas id="canvas"></canvas>

    <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const reader = document.getElementById("reader");
    const faceGuide = document.getElementById("faceGuide");
    const mainMessage = document.getElementById("mainMessage");
    const subMessage = document.getElementById("subMessage");
    const connectionStatus = document.getElementById("connectionStatus");
    const stateLabel = document.getElementById("stateLabel");
    const readerOverlay = document.getElementById("readerOverlay");
    const readerOverlayIcon = document.getElementById("readerOverlayIcon");
    const readerOverlayTitle = document.getElementById("readerOverlayTitle");
    const readerOverlaySubtitle = document.getElementById("readerOverlaySubtitle");
    const readerOverlayMeta = document.getElementById("readerOverlayMeta");
    const resultIcon = document.getElementById("resultIcon");
    const resultName = document.getElementById("resultName");
    const resultDetail = document.getElementById("resultDetail");
    const btnEntrada = document.getElementById("btnEntrada");
    const btnSalida = document.getElementById("btnSalida");
    const btnStart = document.getElementById("btnStart");
    const btnFlip = document.getElementById("btnFlip");
    const btnFull = document.getElementById("btnFull");
    const btnReload = document.getElementById("btnReload");
    const btnExit = document.getElementById("btnExit");
    const btnSound = document.getElementById("btnSound");

    const DETECCION_INTERVALO = 900;
    const ESTABILIDAD_MS = 1400;
    const PAUSA_EXITO_MS = 2500;
    const PAUSA_AVISO_MS = 2800;
    const PAUSA_ERROR_MS = 1800;
    const ORIGEN = "biometrico_celular";
    const SOUND_PREF_KEY = "clockin_mobile_biometric_sound";
    const READER_STATES = {
        WAITING: "WAITING",
        FACE_DETECTED: "FACE_DETECTED",
        VERIFYING: "VERIFYING",
        SUCCESS: "SUCCESS",
        ALREADY_MARKED: "ALREADY_MARKED",
        DENIED: "DENIED",
        ERROR: "ERROR",
        NO_CAMERA: "NO_CAMERA",
        OFFLINE: "OFFLINE",
    };

    let stream = null;
    let streamReady = false;
    let facingMode = "user";
    let modo = "entrada";
    let enviando = false;
    let detectando = false;
    let rostroDesde = null;
    let pausaHasta = 0;
    let loopId = null;
    let resetTimer = null;
    let audioUnlocked = false;
    let lastAudioKey = "";
    let lastAudioAt = 0;
    const playedAudioAt = new Map();
    let soundEnabled = localStorage.getItem(SOUND_PREF_KEY) !== "off";

    const STATE_TEXT = {
        WAITING: ["Esperando", "Acerque su rostro", "Mantenga el rostro dentro del marco.", ""],
        FACE_DETECTED: ["Rostro detectado", "Rostro detectado", "Manténgase estable para verificar identidad.", "ok"],
        VERIFYING: ["Verificando", "Verificando identidad…", "No se mueva, estamos validando la marcación.", "verifying"],
        SUCCESS: ["Correcto", "Correcto", "Acceso correcto", "ok"],
        ALREADY_MARKED: ["Aviso", "Marcación ya realizada", "El funcionario ya fue reconocido.", "warn"],
        DENIED: ["Denegado", "Acceso denegado", "Rostro no reconocido. Intente nuevamente.", "error"],
        ERROR: ["Error", "Intente nuevamente", "No se pudo completar la validación.", ""],
        NO_CAMERA: ["Sin cámara", "No se pudo acceder a la cámara", "Revise permisos del navegador.", "error"],
        OFFLINE: ["Sin conexión", "No hay conexión con el servidor", "Reconecte internet para registrar marcaciones.", "warn"],
    };

    function setReaderState(state, payload = {}) {
        const cfg = STATE_TEXT[state] || STATE_TEXT.WAITING;
        reader.dataset.state = state;
        stateLabel.textContent = payload.label || cfg[0];
        mainMessage.textContent = payload.title || cfg[1];
        subMessage.textContent = payload.detail || cfg[2] || "";
        faceGuide.className = "face-guide" + (payload.guide || cfg[3] ? " " + (payload.guide || cfg[3]) : "");

        if (state === READER_STATES.WAITING) {
            readerOverlay.className = "reader-result-overlay";
            readerOverlay.setAttribute("aria-hidden", "true");
            lastAudioKey = "";
        }

        if (state === READER_STATES.SUCCESS || state === READER_STATES.ALREADY_MARKED || state === READER_STATES.DENIED || state === READER_STATES.ERROR) {
            showReaderOverlay(state, payload);
        }

        if (payload.sound) playFeedback(payload.sound, payload.audioKey || `${state}-${Date.now()}`);
        if (payload.vibrate && "vibrate" in navigator) navigator.vibrate(payload.vibrate);
    }

    function setMessage(title, detail, type = "") {
        const state = type === "ok" ? READER_STATES.FACE_DETECTED : type === "error" ? READER_STATES.ERROR : type === "warn" ? READER_STATES.OFFLINE : READER_STATES.WAITING;
        setReaderState(state, { title, detail, guide: type });
    }

    function showReaderOverlay(state, payload = {}) {
        const visual = state === READER_STATES.SUCCESS ? "success" : state === READER_STATES.ALREADY_MARKED ? "warning" : state === READER_STATES.DENIED ? "denied" : "error";
        const defaults = {
            success: ["✓", "Correcto", "Acceso correcto"],
            warning: ["!", "Aviso", "Marcación ya realizada"],
            denied: ["×", "Acceso denegado", "Rostro no reconocido"],
            error: ["!", "Error de conexión", "Intente nuevamente"],
        };
        const cfg = defaults[visual];
        readerOverlayIcon.textContent = payload.icon || cfg[0];
        readerOverlayTitle.textContent = payload.overlayTitle || cfg[1];
        readerOverlaySubtitle.textContent = payload.overlaySubtitle || cfg[2];
        readerOverlayMeta.textContent = payload.meta || "";
        readerOverlay.className = "reader-result-overlay show " + visual;
        readerOverlay.setAttribute("aria-hidden", "false");
    }

    function syncSoundButton() {
        btnSound.textContent = soundEnabled ? "Sonido ON" : "Sonido OFF";
        btnSound.classList.toggle("off", !soundEnabled);
        btnSound.setAttribute("aria-pressed", soundEnabled ? "true" : "false");
    }

    function unlockAudio() {
        audioUnlocked = true;
        if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function playFeedback(type, key) {
        if (!soundEnabled || !audioUnlocked || !window.speechSynthesis) return;
        const now = Date.now();
        const repeatAt = playedAudioAt.get(key) || 0;
        if (lastAudioKey === key || now - lastAudioAt < 900 || now - repeatAt < 8000) return;
        lastAudioKey = key;
        lastAudioAt = now;
        playedAudioAt.set(key, now);
        window.speechSynthesis.cancel();
        const phrases = {
            success: "Acceso correcto",
            already_entry: "Entrada ya registrada",
            already_exit: "Salida ya registrada",
            already: "Marcación ya realizada",
            denied: "Acceso denegado",
        };
        const phrase = phrases[type];
        if (!phrase) return;
        const utterance = new SpeechSynthesisUtterance(phrase);
        utterance.lang = "es-PY";
        utterance.rate = 1;
        utterance.pitch = type === "success" ? 1.05 : type === "denied" ? .86 : .98;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function scheduleReset(ms) {
        if (resetTimer) clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
            if (streamReady) {
                setReaderState(READER_STATES.WAITING);
                resultIcon.textContent = "ID";
                resultIcon.className = "result-icon";
                resultName.textContent = "Esperando marcación";
                resultDetail.textContent = "Listo para la siguiente lectura.";
            }
        }, ms);
    }

    function initials(name) {
        return String(name || "").trim().split(/\s+/).slice(0, 2).map(part => part.charAt(0).toUpperCase()).join("");
    }

    function setConnection(ok, working = false) {
        connectionStatus.textContent = ok ? (working ? "Verificando" : "Conectado") : "Sin conexión";
        connectionStatus.className = "status-pill " + (ok ? (working ? "work" : "ready") : "offline");
    }

    function errorCamara(error) {
        const name = String(error && error.name || "");
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return "Este navegador no permite usar la cámara.";
        }
        if (location.protocol !== "https:" && location.hostname !== "127.0.0.1" && location.hostname !== "localhost") {
            return "La cámara requiere conexión segura HTTPS.";
        }
        if (name === "NotAllowedError") return "Permiso de cámara denegado. Autorice la cámara para continuar.";
        if (name === "NotFoundError") return "No se encontró una cámara disponible.";
        if (name === "NotReadableError") return "La cámara está ocupada por otra aplicación.";
        return "No se pudo abrir la cámara del dispositivo.";
    }

    async function startCamera() {
        unlockAudio();
        stopCamera();
        setReaderState(READER_STATES.VERIFYING, { title: "Preparando cámara…", detail: "Solicitando permiso del dispositivo." });
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode,
                    width: { ideal: 720 },
                    height: { ideal: 1280 },
                    frameRate: { ideal: 18, max: 24 }
                },
                audio: false
            });
            video.srcObject = stream;
            await video.play().catch(() => {});
            streamReady = true;
            setConnection(navigator.onLine);
            setReaderState(READER_STATES.WAITING);
            startLoop();
        } catch (error) {
            streamReady = false;
            setConnection(false);
            setReaderState(READER_STATES.NO_CAMERA, { detail: errorCamara(error) });
            resultName.textContent = "Revise permisos";
            resultDetail.textContent = "En iPhone o Android, permita el acceso a la cámara desde el navegador.";
        }
    }

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        stream = null;
        streamReady = false;
    }

    function startLoop() {
        if (loopId) clearInterval(loopId);
        loopId = setInterval(detectar, DETECCION_INTERVALO);
    }

    function capturar(calidad = 0.78, anchoObjetivo = 640) {
        if (!video.videoWidth || !video.videoHeight) return null;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        let width = video.videoWidth;
        let height = video.videoHeight;
        if (width > anchoObjetivo) {
            height = Math.round(height * (anchoObjetivo / width));
            width = anchoObjetivo;
        }
        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(video, 0, 0, width, height);
        return canvas.toDataURL("image/jpeg", calidad);
    }

    async function enviarReconocimiento(soloDeteccion) {
        const imagen = capturar(soloDeteccion ? 0.72 : 0.88, soloDeteccion ? 640 : 900);
        if (!imagen) return null;
        const res = await fetch("{% url 'biometrico_reconocer' %}", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({
                imagen,
                modo,
                origen: ORIGEN,
                solo_deteccion: soloDeteccion ? "1" : "0"
            })
        });
        return await res.json();
    }

    async function detectar() {
        if (!streamReady || enviando || detectando || Date.now() < pausaHasta) return;
        if (!navigator.onLine) {
            setConnection(false);
            setReaderState(READER_STATES.OFFLINE);
            return;
        }
        detectando = true;
        try {
            const json = await enviarReconocimiento(true);
            setConnection(true);
            if (!json || !json.hay_rostro) {
                rostroDesde = null;
                setReaderState(READER_STATES.WAITING, { detail: json && json.mensaje ? json.mensaje : "Esperando rostro frente a cámara." });
                return;
            }
            if (Number(json.cantidad_rostros || 0) > 1) {
                rostroDesde = null;
                setReaderState(READER_STATES.ERROR, { label: "Atención", title: "Una persona a la vez", detail: "Debe acercarse una sola persona.", guide: "warn" });
                return;
            }
            if (!rostroDesde) rostroDesde = Date.now();
            const estable = Date.now() - rostroDesde;
            if (estable >= ESTABILIDAD_MS) {
                setConnection(true, true);
                setReaderState(READER_STATES.VERIFYING);
                await reconocer();
            } else {
                setReaderState(READER_STATES.FACE_DETECTED, { detail: "Mantenga el rostro estable." });
            }
        } catch (error) {
            setConnection(false);
            setReaderState(READER_STATES.OFFLINE, { detail: "No fue posible contactar al servidor." });
        } finally {
            detectando = false;
        }
    }


    function normalizeResult(json) {
        const code = String(json && json.result_code || "").toUpperCase();
        if (code) return code;
        const tipo = String(json && json.tipo || "").toLowerCase();
        if (json && json.ok) {
            if (["entrada", "regreso_almuerzo"].includes(tipo)) return "SUCCESS_ENTRY";
            if (["salida", "salida_almuerzo"].includes(tipo)) return "SUCCESS_EXIT";
            return "SUCCESS";
        }
        if (["espera_salida_almuerzo", "espera_salida_final"].includes(tipo)) return "ALREADY_ENTRY";
        if (["espera_regreso_almuerzo"].includes(tipo)) return "ALREADY_EXIT";
        if (tipo === "ya_completo") return modo === "salida" ? "ALREADY_EXIT" : "ALREADY_COMPLETE";
        if (["duplicado", "procesando"].includes(tipo)) return "COOLDOWN";
        if (["no_reconocido", "sin_coincidencia", "rostro_desconocido"].includes(tipo)) return "FACE_NOT_RECOGNIZED";
        if (!json || tipo.startsWith("error") || tipo === "multiples_rostros") return "TECHNICAL_ERROR";
        return "TECHNICAL_ERROR";
    }

    function resultKind(code) {
        if (["SUCCESS", "SUCCESS_ENTRY", "SUCCESS_EXIT"].includes(code)) return READER_STATES.SUCCESS;
        if (["ALREADY_ENTRY", "ALREADY_EXIT", "ALREADY_COMPLETE"].includes(code)) return READER_STATES.ALREADY_MARKED;
        if (code === "FACE_NOT_RECOGNIZED") return READER_STATES.DENIED;
        return READER_STATES.ERROR;
    }

    function alreadyText(code) {
        if (code === "ALREADY_ENTRY") return ["Ya marcó Entrada", "La entrada de hoy ya fue registrada.", "already_entry"];
        if (code === "ALREADY_EXIT") return ["Ya marcó Salida", "La salida ya fue registrada anteriormente.", "already_exit"];
        return ["Marcación ya realizada", "La jornada ya tiene sus marcaciones completas.", "already"];
    }

    async function reconocer() {
        if (enviando) return;
        enviando = true;
        try {
            const json = await enviarReconocimiento(false);
            const code = normalizeResult(json);
            const kind = resultKind(code);
            const nombre = json && json.funcionario ? json.funcionario : "";
            const tipo = json && (json.subtipo || json.tipo) ? (json.subtipo || json.tipo) : "Marcación";
            const hora = json && (json.hora || json.hora_previa) ? (json.hora || json.hora_previa) : "";
            const turno = json && json.turno ? json.turno : "";

            if (kind === READER_STATES.SUCCESS) {
                const titulo = code === "SUCCESS_EXIT" ? "Salida registrada" : "Entrada registrada";
                resultIcon.textContent = initials(nombre) || "✓";
                resultIcon.className = "result-icon ok";
                resultName.textContent = nombre || "Marcación registrada";
                resultDetail.textContent = [titulo, hora, turno].filter(Boolean).join(" · ");
                setReaderState(READER_STATES.SUCCESS, {
                    overlayTitle: "Correcto",
                    overlaySubtitle: titulo,
                    meta: [nombre, hora].filter(Boolean).join(" · "),
                    sound: "success",
                    audioKey: `success-${json && json.funcionario_id || nombre}-${code}-${hora}`,
                    vibrate: [80]
                });
                pausaHasta = Date.now() + PAUSA_EXITO_MS;
                scheduleReset(PAUSA_EXITO_MS);
                return;
            }

            if (kind === READER_STATES.ALREADY_MARKED) {
                const [titulo, detalle, audioType] = alreadyText(code);
                resultIcon.textContent = "!";
                resultIcon.className = "result-icon warn";
                resultName.textContent = nombre || titulo;
                resultDetail.textContent = [titulo, hora ? `Registrada a las ${hora}` : detalle].filter(Boolean).join(" · ");
                setReaderState(READER_STATES.ALREADY_MARKED, {
                    icon: "!",
                    label: "Aviso",
                    title: titulo,
                    detail: nombre ? `${nombre}. ${detalle}` : detalle,
                    overlayTitle: titulo,
                    overlaySubtitle: nombre || detalle,
                    meta: hora ? `Registrada anteriormente: ${hora}` : detalle,
                    guide: "warn",
                    sound: audioType,
                    audioKey: `already-${json && json.funcionario_id || nombre}-${code}`,
                    vibrate: [100, 50, 100]
                });
                pausaHasta = Date.now() + PAUSA_AVISO_MS;
                scheduleReset(PAUSA_AVISO_MS);
                return;
            }

            if (kind === READER_STATES.DENIED) {
                resultIcon.textContent = "×";
                resultIcon.className = "result-icon bad";
                resultName.textContent = "Acceso denegado";
                resultDetail.textContent = "Rostro no reconocido.";
                setReaderState(READER_STATES.DENIED, {
                    meta: "Rostro no reconocido",
                    sound: "denied",
                    audioKey: `denied-${code}-${Math.floor(Date.now() / 3000)}`,
                    vibrate: [120, 60, 120]
                });
                pausaHasta = Date.now() + PAUSA_ERROR_MS;
                scheduleReset(PAUSA_ERROR_MS);
                return;
            }

            const detalleTecnico = json && json.mensaje ? json.mensaje : "No se pudo procesar la marcación.";
            resultIcon.textContent = "!";
            resultIcon.className = "result-icon info";
            resultName.textContent = code === "COOLDOWN" ? "Lectura reciente" : "No se pudo procesar";
            resultDetail.textContent = detalleTecnico;
            setReaderState(READER_STATES.ERROR, {
                icon: "!",
                label: code === "COOLDOWN" ? "Pausa" : "Error",
                title: code === "COOLDOWN" ? "Espere unos segundos" : "Error de conexión",
                detail: detalleTecnico,
                overlayTitle: code === "COOLDOWN" ? "Lectura reciente" : "Error de conexión",
                overlaySubtitle: code === "COOLDOWN" ? "Espere unos segundos" : "Intente nuevamente",
                meta: detalleTecnico,
                vibrate: code === "COOLDOWN" ? [60] : [80, 40, 80]
            });
            pausaHasta = Date.now() + PAUSA_ERROR_MS;
            scheduleReset(PAUSA_ERROR_MS);
        } catch (error) {
            setConnection(false);
            resultIcon.textContent = "!";
            resultIcon.className = "result-icon info";
            resultName.textContent = "Error de conexión";
            resultDetail.textContent = "No se registró ninguna marcación.";
            setReaderState(READER_STATES.ERROR, {
                icon: "!",
                label: "Error",
                title: "Error de conexión",
                detail: "No se registró ninguna marcación.",
                overlayTitle: "Error de conexión",
                overlaySubtitle: "Intente nuevamente"
            });
            pausaHasta = Date.now() + PAUSA_ERROR_MS;
            scheduleReset(PAUSA_ERROR_MS);
        } finally {
            enviando = false;
            rostroDesde = null;
        }
    }

    btnEntrada.addEventListener("click", () => {
        modo = "entrada";
        btnEntrada.classList.add("active");
        btnSalida.classList.remove("active");
        setMessage("Modo entrada", "Entrada del día o regreso de almuerzo.");
    });

    btnSalida.addEventListener("click", () => {
        modo = "salida";
        btnSalida.classList.add("active");
        btnEntrada.classList.remove("active");
        setMessage("Modo salida", "Salida a almuerzo o salida final.");
    });

    btnStart.addEventListener("click", startCamera);
    btnSound.addEventListener("click", () => {
        unlockAudio();
        soundEnabled = !soundEnabled;
        localStorage.setItem(SOUND_PREF_KEY, soundEnabled ? "on" : "off");
        syncSoundButton();
    });
    btnFlip.addEventListener("click", async () => {
        facingMode = facingMode === "user" ? "environment" : "user";
        await startCamera();
    });
    btnFull.addEventListener("click", async () => {
        if (document.fullscreenElement) {
            await document.exitFullscreen().catch(() => {});
        } else if (reader.requestFullscreen) {
            await reader.requestFullscreen().catch(() => {
                setMessage("Pantalla completa no disponible", "Agregue ClockIn a la pantalla de inicio para usarlo como app.", "warn");
            });
        } else {
            setMessage("Pantalla completa no disponible", "Agregue ClockIn a la pantalla de inicio para usarlo como app.", "warn");
        }
    });
    btnReload.addEventListener("click", () => location.reload());
    btnExit.addEventListener("click", () => {
        stopCamera();
        window.location.href = "{% url 'biometrico_inicio' %}";
    });

    window.addEventListener("online", () => { setConnection(true); if (streamReady) setReaderState(READER_STATES.WAITING); });
    window.addEventListener("offline", () => { setConnection(false); setReaderState(READER_STATES.OFFLINE); });
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopCamera();
    });
    syncSoundButton();
    setConnection(navigator.onLine);
    startCamera();
    </script>
</body>
</html>
