{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#061224">
    <title>Lector biométrico celular | ClockIn</title>
    <style>
        :root {
            --bg: #061224;
            --panel: rgba(15, 23, 42, .82);
            --line: rgba(148, 163, 184, .18);
            --text: #f8fafc;
            --muted: #9fb3c8;
            --ok: #22c55e;
            --warn: #f59e0b;
            --danger: #ef4444;
            --brand: #38bdf8;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: radial-gradient(circle at top, #123767 0, #07182d 42%, #030712 100%);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }

        body { min-height: 100dvh; }

        .mobile-reader {
            height: 100dvh;
            width: 100vw;
            display: grid;
            grid-template-rows: auto 1fr auto;
            padding: calc(10px + var(--safe-top)) 12px calc(10px + var(--safe-bottom));
            gap: 10px;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 58px;
        }

        .brand {
            min-width: 0;
        }

        .brand strong {
            display: block;
            font-size: 17px;
            line-height: 1.1;
        }

        .brand span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 56vw;
        }

        .status-pill {
            border: 1px solid var(--line);
            background: rgba(15, 23, 42, .68);
            color: #dbeafe;
            border-radius: 999px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .status-pill.offline { color: #fecaca; border-color: rgba(239, 68, 68, .35); }
        .status-pill.ready { color: #bbf7d0; border-color: rgba(34, 197, 94, .35); }

        .camera-shell {
            min-height: 0;
            border: 1px solid rgba(148, 163, 184, .2);
            border-radius: 28px;
            background: rgba(2, 6, 23, .62);
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .34);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #020617;
        }

        .face-guide {
            position: absolute;
            inset: 11% 13% 19%;
            border: 3px solid rgba(56, 189, 248, .78);
            border-radius: 42% 42% 36% 36%;
            box-shadow: 0 0 0 999px rgba(2, 6, 23, .24), 0 0 42px rgba(56, 189, 248, .18);
            pointer-events: none;
        }

        .face-guide.ok { border-color: rgba(34, 197, 94, .9); }
        .face-guide.error { border-color: rgba(239, 68, 68, .9); }
        .face-guide.warn { border-color: rgba(245, 158, 11, .9); }

        .camera-message {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid rgba(148, 163, 184, .18);
            border-radius: 22px;
            background: rgba(15, 23, 42, .86);
            backdrop-filter: blur(14px);
            padding: 14px;
        }

        .camera-message strong {
            display: block;
            font-size: 19px;
            margin-bottom: 4px;
        }

        .camera-message span {
            color: var(--muted);
            font-size: 13px;
        }

        .result {
            display: grid;
            grid-template-columns: 52px 1fr;
            gap: 12px;
            align-items: center;
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 24px;
            padding: 12px;
            min-height: 80px;
        }

        .result-icon {
            width: 52px;
            height: 52px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: rgba(56, 189, 248, .15);
            font-size: 24px;
        }

        .result-name {
            font-size: 18px;
            font-weight: 950;
            line-height: 1.1;
        }

        .result-detail {
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .ctrl {
            border: 1px solid rgba(148, 163, 184, .16);
            background: rgba(15, 23, 42, .86);
            color: var(--text);
            border-radius: 18px;
            min-height: 56px;
            padding: 8px 6px;
            font-size: 11px;
            font-weight: 900;
            display: grid;
            place-items: center;
            gap: 3px;
            touch-action: manipulation;
        }

        .ctrl span { font-size: 19px; line-height: 1; }
        .ctrl.primary { background: linear-gradient(135deg, #2563eb, #0ea5e9); }
        .ctrl.danger { background: rgba(239, 68, 68, .18); color: #fecaca; }

        .mode-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .mode {
            border: 1px solid var(--line);
            border-radius: 18px;
            min-height: 46px;
            background: rgba(15, 23, 42, .72);
            color: #cbd5e1;
            font-weight: 950;
        }

        .mode.active.entrada { background: rgba(34, 197, 94, .22); color: #bbf7d0; border-color: rgba(34, 197, 94, .45); }
        .mode.active.salida { background: rgba(245, 158, 11, .22); color: #fde68a; border-color: rgba(245, 158, 11, .45); }

        canvas { display: none; }

        @media (orientation: landscape) and (max-height: 520px) {
            .mobile-reader {
                grid-template-columns: 1fr 280px;
                grid-template-rows: auto 1fr;
            }
            .camera-shell {
                grid-row: 1 / span 2;
            }
            .top, .result, .controls-wrap {
                grid-column: 2;
            }
            .controls {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 340px) {
            .controls { gap: 6px; }
            .ctrl { min-height: 52px; font-size: 10px; border-radius: 16px; }
            .camera-message strong { font-size: 17px; }
        }
    </style>
</head>
<body>
    <main class="mobile-reader" id="reader">
        <header class="top">
            <div class="brand">
                <strong>ClockIn</strong>
                <span>Lector biométrico para celular</span>
            </div>
            <div class="status-pill ready" id="connectionStatus">Conectado</div>
        </header>

        <section class="camera-shell" id="cameraShell">
            <video id="video" autoplay playsinline muted></video>
            <div class="face-guide" id="faceGuide"></div>
            <div class="camera-message">
                <strong id="mainMessage">Acerque su rostro</strong>
                <span id="subMessage">Use la cámara frontal y mantenga el rostro dentro del marco.</span>
            </div>
        </section>

        <section class="result" id="resultBox">
            <div class="result-icon" id="resultIcon">👤</div>
            <div>
                <div class="result-name" id="resultName">Esperando marcación</div>
                <div class="result-detail" id="resultDetail">Sin lectura activa.</div>
            </div>
        </section>

        <section class="controls-wrap">
            <div class="mode-row">
                <button class="mode entrada active" id="btnEntrada" type="button">Entrada</button>
                <button class="mode salida" id="btnSalida" type="button">Salida</button>
            </div>
            <div style="height:8px"></div>
            <div class="controls">
                <button class="ctrl primary" id="btnStart" type="button"><span>▶</span>Iniciar</button>
                <button class="ctrl" id="btnFlip" type="button"><span>↺</span>Cámara</button>
                <button class="ctrl" id="btnFull" type="button"><span>⛶</span>Full</button>
                <button class="ctrl" id="btnReload" type="button"><span>⟳</span>Recargar</button>
                <button class="ctrl danger" id="btnExit" type="button"><span>×</span>Salir</button>
            </div>
        </section>
    </main>

    <canvas id="canvas"></canvas>

    <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const reader = document.getElementById("reader");
    const faceGuide = document.getElementById("faceGuide");
    const mainMessage = document.getElementById("mainMessage");
    const subMessage = document.getElementById("subMessage");
    const connectionStatus = document.getElementById("connectionStatus");
    const resultIcon = document.getElementById("resultIcon");
    const resultName = document.getElementById("resultName");
    const resultDetail = document.getElementById("resultDetail");
    const btnEntrada = document.getElementById("btnEntrada");
    const btnSalida = document.getElementById("btnSalida");
    const btnStart = document.getElementById("btnStart");
    const btnFlip = document.getElementById("btnFlip");
    const btnFull = document.getElementById("btnFull");
    const btnReload = document.getElementById("btnReload");
    const btnExit = document.getElementById("btnExit");

    const DETECCION_INTERVALO = 900;
    const ESTABILIDAD_MS = 1400;
    const PAUSA_EXITO_MS = 2500;
    const PAUSA_ERROR_MS = 1800;
    const ORIGEN = "biometrico_celular";

    let stream = null;
    let streamReady = false;
    let facingMode = "user";
    let modo = "entrada";
    let enviando = false;
    let detectando = false;
    let rostroDesde = null;
    let pausaHasta = 0;
    let loopId = null;

    function setMessage(title, detail, type = "") {
        mainMessage.textContent = title;
        subMessage.textContent = detail || "";
        faceGuide.className = "face-guide" + (type ? " " + type : "");
    }

    function setConnection(ok) {
        connectionStatus.textContent = ok ? "Conectado" : "Sin conexión";
        connectionStatus.className = "status-pill " + (ok ? "ready" : "offline");
    }

    function errorCamara(error) {
        const name = String(error && error.name || "");
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return "Este navegador no permite usar la cámara.";
        }
        if (location.protocol !== "https:" && location.hostname !== "127.0.0.1" && location.hostname !== "localhost") {
            return "La cámara requiere conexión segura HTTPS.";
        }
        if (name === "NotAllowedError") return "Permiso de cámara denegado. Autorice la cámara para continuar.";
        if (name === "NotFoundError") return "No se encontró una cámara disponible.";
        if (name === "NotReadableError") return "La cámara está ocupada por otra aplicación.";
        return "No se pudo abrir la cámara del dispositivo.";
    }

    async function startCamera() {
        stopCamera();
        setMessage("Iniciando cámara", "Solicitando permiso del dispositivo...");
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode,
                    width: { ideal: 720 },
                    height: { ideal: 1280 },
                    frameRate: { ideal: 18, max: 24 }
                },
                audio: false
            });
            video.srcObject = stream;
            await video.play().catch(() => {});
            streamReady = true;
            setConnection(navigator.onLine);
            setMessage("Acerque su rostro", "Mantenga el rostro dentro del marco.");
            startLoop();
        } catch (error) {
            streamReady = false;
            setConnection(false);
            setMessage("Cámara no disponible", errorCamara(error), "error");
            resultName.textContent = "Revise permisos";
            resultDetail.textContent = "En iPhone o Android, permita el acceso a la cámara desde el navegador.";
        }
    }

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        stream = null;
        streamReady = false;
    }

    function startLoop() {
        if (loopId) clearInterval(loopId);
        loopId = setInterval(detectar, DETECCION_INTERVALO);
    }

    function capturar(calidad = 0.78, anchoObjetivo = 640) {
        if (!video.videoWidth || !video.videoHeight) return null;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        let width = video.videoWidth;
        let height = video.videoHeight;
        if (width > anchoObjetivo) {
            height = Math.round(height * (anchoObjetivo / width));
            width = anchoObjetivo;
        }
        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(video, 0, 0, width, height);
        return canvas.toDataURL("image/jpeg", calidad);
    }

    async function enviarReconocimiento(soloDeteccion) {
        const imagen = capturar(soloDeteccion ? 0.72 : 0.88, soloDeteccion ? 640 : 900);
        if (!imagen) return null;
        const res = await fetch("{% url 'biometrico_reconocer' %}", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({
                imagen,
                modo,
                origen: ORIGEN,
                solo_deteccion: soloDeteccion ? "1" : "0"
            })
        });
        return await res.json();
    }

    async function detectar() {
        if (!streamReady || enviando || detectando || Date.now() < pausaHasta) return;
        if (!navigator.onLine) {
            setConnection(false);
            setMessage("Sin conexión", "No se pueden registrar marcaciones sin conexión.", "warn");
            return;
        }
        detectando = true;
        try {
            const json = await enviarReconocimiento(true);
            setConnection(true);
            if (!json || !json.hay_rostro) {
                rostroDesde = null;
                setMessage("Acerque su rostro", json && json.mensaje ? json.mensaje : "Esperando rostro frente a cámara.");
                return;
            }
            if (Number(json.cantidad_rostros || 0) > 1) {
                rostroDesde = null;
                setMessage("Una persona a la vez", "Debe acercarse una sola persona.", "warn");
                return;
            }
            if (!rostroDesde) rostroDesde = Date.now();
            const estable = Date.now() - rostroDesde;
            setMessage(estable >= ESTABILIDAD_MS ? "Verificando" : "Rostro detectado", "Mantenga el rostro estable.", "ok");
            if (estable >= ESTABILIDAD_MS) await reconocer();
        } catch (error) {
            setConnection(false);
            setMessage("Sin conexión", "No fue posible contactar al servidor.", "warn");
        } finally {
            detectando = false;
        }
    }

    async function reconocer() {
        if (enviando) return;
        enviando = true;
        try {
            const json = await enviarReconocimiento(false);
            if (json && json.ok) {
                resultIcon.textContent = "✓";
                resultName.textContent = json.funcionario || "Marcación registrada";
                resultDetail.textContent = `${json.subtipo || json.tipo || "Marcación"} · ${json.hora || ""} · ${json.turno || ""}`;
                setMessage("Marcación registrada", json.mensaje || "Validación completada.", "ok");
                pausaHasta = Date.now() + PAUSA_EXITO_MS;
            } else {
                resultIcon.textContent = "!";
                resultName.textContent = "No reconocido";
                resultDetail.textContent = json && json.mensaje ? json.mensaje : "Intente nuevamente.";
                setMessage("Intente nuevamente", resultDetail.textContent, "error");
                pausaHasta = Date.now() + PAUSA_ERROR_MS;
            }
        } catch (error) {
            setConnection(false);
            setMessage("Sin conexión", "No se registró ninguna marcación.", "warn");
        } finally {
            enviando = false;
            rostroDesde = null;
        }
    }

    btnEntrada.addEventListener("click", () => {
        modo = "entrada";
        btnEntrada.classList.add("active");
        btnSalida.classList.remove("active");
        setMessage("Modo entrada", "Entrada del día o regreso de almuerzo.");
    });

    btnSalida.addEventListener("click", () => {
        modo = "salida";
        btnSalida.classList.add("active");
        btnEntrada.classList.remove("active");
        setMessage("Modo salida", "Salida a almuerzo o salida final.");
    });

    btnStart.addEventListener("click", startCamera);
    btnFlip.addEventListener("click", async () => {
        facingMode = facingMode === "user" ? "environment" : "user";
        await startCamera();
    });
    btnFull.addEventListener("click", async () => {
        if (document.fullscreenElement) {
            await document.exitFullscreen().catch(() => {});
        } else if (reader.requestFullscreen) {
            await reader.requestFullscreen().catch(() => {
                setMessage("Pantalla completa no disponible", "Agregue ClockIn a la pantalla de inicio para usarlo como app.", "warn");
            });
        } else {
            setMessage("Pantalla completa no disponible", "Agregue ClockIn a la pantalla de inicio para usarlo como app.", "warn");
        }
    });
    btnReload.addEventListener("click", () => location.reload());
    btnExit.addEventListener("click", () => {
        stopCamera();
        window.location.href = "{% url 'biometrico_inicio' %}";
    });

    window.addEventListener("online", () => setConnection(true));
    window.addEventListener("offline", () => setConnection(false));
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopCamera();
    });

    setConnection(navigator.onLine);
    startCamera();
    </script>
</body>
</html>
